<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAZM WB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000)}
.container{padding:20px;max-width:600px;margin:0 auto}
.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:20px;border-radius:15px;margin-bottom:20px;text-align:center}
.header h1{font-size:24px;margin-bottom:5px}
.header p{opacity:.9}
.auth-section{background:var(--tg-theme-secondary-bg-color,#f0f0f0);padding:20px;border-radius:15px;margin-bottom:20px;text-align:center}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}
.menu-item{background:var(--tg-theme-button-color,#3390ec);color:white;padding:20px;border-radius:12px;text-align:center;cursor:pointer;transition:transform .2s}
.menu-item:active{transform:scale(.95)}
.menu-item .icon{font-size:32px;margin-bottom:8px}
.upload-section{background:var(--tg-theme-secondary-bg-color,#f0f0f0);padding:20px;border-radius:15px;margin-bottom:20px}
.upload-btn{background:#10b981;color:white;padding:15px;border:none;border-radius:10px;width:100%;font-size:16px;cursor:pointer;margin-top:10px}
.auth-btn{background:#667eea;color:white;padding:15px;border:none;border-radius:10px;width:100%;font-size:16px;cursor:pointer;margin-top:10px}
.video-item{background:white;padding:15px;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
input{width:100%;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #ccc}
.hidden{display:none}
.admin-badge{background:#10b981;color:white;padding:5px 10px;border-radius:5px;font-size:12px;display:inline-block;margin-left:10px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🎓 NAZM WB<span id="adminBadge" class="admin-badge hidden">👑 Администратор</span></h1>
<p>Обучающая платформа Wildberries</p>
</div>

<div id="authSection" class="auth-section">
<h3>📱 Введите номер телефона</h3>
<p style="margin:10px 0;font-size:14px;opacity:0.7">Введите номер с кодом страны (например: +992900123456)</p>
<input type="tel" id="phoneInput" placeholder="+992..." pattern="\+[0-9]+">
<button class="auth-btn" onclick="submitPhone()">✅ Продолжить</button>
<div id="subscribeMessage" class="hidden" style="margin-top:20px;padding:15px;background:#fff3cd;border-radius:10px">
<p style="margin-bottom:10px">⚠️ Для доступа к курсам подпишитесь на нашего бота:</p>
<button class="auth-btn" onclick="subscribeTelegramBot()">📲 Подписаться на бота</button>
<button class="auth-btn" style="background:#10b981;margin-top:5px" onclick="checkSubscription()">✅ Я подписался</button>
</div>
</div>

<div id="mainContent" class="hidden">
<div class="menu">
<div class="menu-item" onclick="showVideos()">
<div class="icon">🎬</div>
<div>Мои курсы</div>
</div>
<div class="menu-item" onclick="showUpload()" id="uploadBtn" class="hidden">
<div class="icon">⬆️</div>
<div>Загрузить</div>
</div>
<div class="menu-item" onclick="showProgress()">
<div class="icon">📊</div>
<div>Прогресс</div>
</div>
<div class="menu-item" onclick="showSettings()">
<div class="icon">⚙️</div>
<div>Настройки</div>
</div>
</div>
<div id="content">
<div id="uploadSection" class="upload-section hidden">
<h3>📤 Загрузка видео</h3>
<input type="text" id="videoTitle" placeholder="Название урока">
<input type="text" id="videoUrl" placeholder="URL видео (YouTube/Vimeo)">
<button class="upload-btn" onclick="uploadVideo()">✅ Сохранить</button>
</div>
<div id="videoList"></div>
</div>
</div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// Список администраторов
const ADMINS = ['khisrav_jalilov', 'safarsamadov'];
const BOT_USERNAME = 'nazm_wb_bot'; // Замените на имя вашего бота

let userData = JSON.parse(localStorage.getItem('userData') || '{}');
const videos = JSON.parse(localStorage.getItem('videos') || '[]');

function checkAuth() {
    const user = tg.initDataUnsafe?.user;
    if (!user) {
        tg.showAlert('Ошибка: не удалось получить данные пользователя');
        return;
    }
    
    const username = user.username || '';
    const userId = user.id;
    
    // Проверка на администратора
    if (ADMINS.includes(username)) {
        userData.isAdmin = true;
        userData.phone = 'admin';
        userData.subscribed = true;
        document.getElementById('adminBadge').classList.remove('hidden');
        document.getElementById('uploadBtn').classList.remove('hidden');
    }
    
    // Проверка авторизации
    if (userData.phone && userData.subscribed) {
        showMainContent();
    } else {
        showAuthSection();
    }
}

function showAuthSection() {
    document.getElementById('authSection').classList.remove('hidden');
    document.getElementById('mainContent').classList.add('hidden');
}

function showMainContent() {
    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('mainContent').classList.remove('hidden');
    showVideos();
}

function submitPhone() {
    const phone = document.getElementById('phoneInput').value.trim();
    
    if (!phone) {
        tg.showAlert('Введите номер телефона');
        return;
    }
    
    if (!phone.startsWith('+')) {
        tg.showAlert('Номер должен начинаться с кода страны (например: +992)');
        return;
    }
    
    if (phone.length < 10) {
        tg.showAlert('Проверьте правильность номера телефона');
        return;
    }
    
    userData.phone = phone;
    localStorage.setItem('userData', JSON.stringify(userData));
    
    // Показываем сообщение о подписке
    document.getElementById('subscribeMessage').classList.remove('hidden');
}

function subscribeTelegramBot() {
    // Открываем бота в Telegram
    tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=subscribe`);
}

function checkSubscription() {
    // В реальном приложении здесь должна быть проверка через бота
    // Для демонстрации просто подтверждаем подписку
    tg.showConfirm('Вы подписались на бота?', (confirmed) => {
        if (confirmed) {
            userData.subscribed = true;
            localStorage.setItem('userData', JSON.stringify(userData));
            tg.showAlert('✅ Отлично! Теперь у вас есть доступ к курсам');
            showMainContent();
        }
    });
}

function uploadVideo() {
    if (!userData.isAdmin) {
        tg.showAlert('Только администраторы могут загружать видео');
        return;
    }
    
    const title = document.getElementById('videoTitle').value;
    const url = document.getElementById('videoUrl').value;
    
    if (!title || !url) {
        tg.showAlert('Заполните все поля!');
        return;
    }
    
    videos.push({title, url, date: new Date().toISOString()});
    localStorage.setItem('videos', JSON.stringify(videos));
    tg.showAlert('Видео добавлено!');
    
    document.getElementById('videoTitle').value = '';
    document.getElementById('videoUrl').value = '';
    showVideos();
}

function showVideos() {
    const list = document.getElementById('videoList');
    if (videos.length === 0) {
        list.innerHTML = '<div class="video-item">📚 Пока нет доступных курсов</div>';
    } else {
        list.innerHTML = videos.map((v, i) => `
            <div class="video-item">
                <h4>${v.title}</h4>
                <a href="${v.url}" target="_blank" style="color:#667eea;text-decoration:none">🎬 Открыть урок</a>
            </div>
        `).join('');
    }
    document.getElementById('uploadSection').classList.add('hidden');
}

function showUpload() {
    if (!userData.isAdmin) {
        tg.showAlert('Только администраторы могут загружать видео');
        return;
    }
    document.getElementById('uploadSection').classList.remove('hidden');
}

function showProgress() {
    tg.showAlert('Раздел в разработке');
}

function showSettings() {
    tg.showAlert('Раздел в разработке');
}

// Инициализация при загрузке
checkAuth();
</script>
</body>
</html>
