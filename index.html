<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAZM WB</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000)}.container{padding:20px;max-width:600px;margin:0 auto}.header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:white;padding:20px;border-radius:15px;margin-bottom:20px;text-align:center}.header h1{font-size:24px;margin-bottom:5px}.header p{opacity:.9}.menu{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:20px}.menu-item{background:var(--tg-theme-button-color,#3390ec);color:white;padding:20px;border-radius:12px;text-align:center;cursor:pointer;transition:transform .2s}.menu-item:active{transform:scale(.95)}.menu-item .icon{font-size:32px;margin-bottom:8px}.upload-section{background:var(--tg-theme-secondary-bg-color,#f0f0f0);padding:20px;border-radius:15px;margin-bottom:20px}.upload-btn{background:#10b981;color:white;padding:15px;border:none;border-radius:10px;width:100%;font-size:16px;cursor:pointer;margin-top:10px}.video-item{background:white;padding:15px;border-radius:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}input{width:100%;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #ccc}
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>🎓 NAZM WB</h1>
<p>Обучающая платформа Wildberries</p>
</div>
<div class="menu">
<div class="menu-item" onclick="showVideos()">
<div class="icon">🎬</div>
<div>Мои курсы</div>
</div>
<div class="menu-item" onclick="showUpload()">
<div class="icon">⬆️</div>
<div>Загрузить</div>
</div>
<div class="menu-item" onclick="showProgress()">
<div class="icon">📊</div>
<div>Прогресс</div>
</div>
<div class="menu-item" onclick="showSettings()">
<div class="icon">⚙️</div>
<div>Настройки</div>
</div>
</div>
<div id="content">
<div class="upload-section">
<h3>📤 Загрузка видео</h3>
<input type="text" id="videoTitle" placeholder="Название урока">
<input type="text" id="videoUrl" placeholder="URL видео (YouTube/Vimeo)">
<button class="upload-btn" onclick="uploadVideo()">✅ Сохранить</button>
</div>
<div id="videoList"></div>
</div>
</div>
<script>
const tg=window.Telegram.WebApp;tg.ready();tg.expand();const videos=JSON.parse(localStorage.getItem('videos')||'[]');function uploadVideo(){const title=document.getElementById('videoTitle').value;const url=document.getElementById('videoUrl').value;if(!title||!url){tg.showAlert('Заполните все поля!');return}videos.push({title,url,date:new Date().toISOString()});localStorage.setItem('videos',JSON.stringify(videos));tg.showAlert('Видео добавлено!');document.getElementById('videoTitle').value='';document.getElementById('videoUrl').value='';showVideos()}function showVideos(){const list=document.getElementById('videoList');list.innerHTML=videos.map((v,i)=>`<div class="video-item"><h4>${v.title}</h4><a href="${v.url}" target="_blank">🎬 Открыть</a></div>`).join('')}function showUpload(){location.reload()}function showProgress(){tg.showAlert('Раздел в разработке')}function showSettings(){tg.showAlert('Раздел в разработке')}showVideos();
</script>
</body>
</html>
